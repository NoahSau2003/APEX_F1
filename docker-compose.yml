services:
  backend:
    build:
      context: ./backend
    environment:
      APEX_DATA_DIR: /app/data
      # Browser may hit :8000 directly; app UI is served on :8080.
      APEX_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://127.0.0.1:5173","http://localhost:8000","http://127.0.0.1:8000"]'
    volumes:
      - apex-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  apex-data:
